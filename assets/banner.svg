<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" width="100%" height="340" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="accentGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <linearGradient id="laserGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0" />
      <stop offset="50%" stop-color="#06b6d4" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.35" />
      <circle cx="40" cy="40" r="1.5" fill="#64748b" fill-opacity="0.4" />
    </pattern>

    <!-- Animation Keyframes -->
    <style>
      @keyframes laserScan {
        0% { transform: translateY(0px); opacity: 0.2; }
        50% { opacity: 0.9; }
        100% { transform: translateY(220px); opacity: 0.2; }
      }
      @keyframes pulseAura {
        0%, 100% { transform: scale(1); opacity: 0.25; }
        50% { transform: scale(1.08); opacity: 0.55; }
      }
      @keyframes floatParticle {
        0%, 100% { transform: translateY(0px) translateX(0px); }
        50% { transform: translateY(-12px) translateX(6px); }
      }
      @keyframes radarSweep {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }

      .animated-scan {
        animation: laserScan 3.5s ease-in-out infinite alternate;
      }
      .animated-pulse {
        transform-origin: 840px 170px;
        animation: pulseAura 4s ease-in-out infinite;
      }
      .animated-particle-1 {
        animation: floatParticle 5s ease-in-out infinite;
      }
      .animated-particle-2 {
        animation: floatParticle 6s ease-in-out infinite reverse;
      }
      .radar-sweep {
        transform-origin: 840px 170px;
        animation: radarSweep 8s linear infinite;
      }
    </style>
  </defs>

  <!-- 1. Background Rect -->
  <rect width="1000" height="340" rx="16" fill="url(#bgGradient)" />
  <rect width="1000" height="340" rx="16" fill="url(#grid)" />

  <!-- 2. Dynamic Ambient Elements (Background Layer) -->
  <g class="animated-pulse" pointer-events="none">
    <circle cx="840" cy="170" r="110" fill="#6366f1" opacity="0.12" filter="blur(30px)" />
    <circle cx="840" cy="170" r="70" fill="#06b6d4" opacity="0.18" filter="blur(20px)" />
  </g>

  <!-- Animated Floating Bokeh Dots in Background -->
  <g class="animated-particle-1" opacity="0.5">
    <circle cx="120" cy="60" r="3" fill="#38bdf8" />
    <circle cx="480" cy="50" r="2" fill="#818cf8" />
    <circle cx="280" cy="280" r="2.5" fill="#a78bfa" />
  </g>
  <g class="animated-particle-2" opacity="0.4">
    <circle cx="70" cy="240" r="2" fill="#c084fc" />
    <circle cx="620" cy="300" r="3" fill="#22d3ee" />
    <circle cx="560" cy="80" r="2" fill="#34d399" />
  </g>

  <!-- 3. Dynamic Scanner Viewfinder HUD (Right Side - does not overlap text) -->
  <g transform="translate(730, 60)">
    <!-- Viewfinder Border Container -->
    <rect x="0" y="0" width="220" height="220" rx="16" fill="#0f172a" fill-opacity="0.65" stroke="#334155" stroke-width="1.5" />
    
    <!-- Reticle Corners -->
    <path d="M 12 30 L 12 12 L 30 12" fill="none" stroke="#06b6d4" stroke-width="3" stroke-linecap="round" />
    <path d="M 190 12 L 208 12 L 208 30" fill="none" stroke="#06b6d4" stroke-width="3" stroke-linecap="round" />
    <path d="M 12 190 L 12 208 L 30 208" fill="none" stroke="#06b6d4" stroke-width="3" stroke-linecap="round" />
    <path d="M 190 208 L 208 208 L 208 190" fill="none" stroke="#06b6d4" stroke-width="3" stroke-linecap="round" />

    <!-- Stylized Concentric Radar Circles -->
    <circle cx="110" cy="110" r="75" fill="none" stroke="#475569" stroke-width="1" stroke-dasharray="4,4" opacity="0.6" />
    <circle cx="110" cy="110" r="45" fill="none" stroke="#0ea5e9" stroke-width="1" opacity="0.4" />
    <circle cx="110" cy="110" r="18" fill="#6366f1" fill-opacity="0.25" stroke="#818cf8" stroke-width="1.5" />

    <!-- Target Crosshairs -->
    <line x1="110" y1="20" x2="110" y2="40" stroke="#06b6d4" stroke-width="1.5" opacity="0.7" />
    <line x1="110" y1="180" x2="110" y2="200" stroke="#06b6d4" stroke-width="1.5" opacity="0.7" />
    <line x1="20" y1="110" x2="40" y2="110" stroke="#06b6d4" stroke-width="1.5" opacity="0.7" />
    <line x1="180" y1="110" x2="200" y2="110" stroke="#06b6d4" stroke-width="1.5" opacity="0.7" />

    <!-- Animated Scanning Laser Line -->
    <g class="animated-scan">
      <line x1="8" y1="0" x2="212" y2="0" stroke="url(#accentGrad1)" stroke-width="3.5" filter="drop-shadow(0 0 8px #06b6d4)" />
      <polygon points="8,-8 212,-8 212,0 8,0" fill="url(#laserGrad)" opacity="0.4" />
    </g>

    <!-- Scan HUD Labels -->
    <text x="110" y="114" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9" font-weight="bold" letter-spacing="1.5" text-anchor="middle">OCR ACTIVE</text>
    <text x="110" y="202" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="8.5" font-weight="600" letter-spacing="1" text-anchor="middle">FPS: 60 • ON-DEVICE</text>
  </g>

  <!-- 4. Top Tag / Category Pill (Foreground) -->
  <g transform="translate(56, 45)">
    <rect x="0" y="0" width="220" height="28" rx="14" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.2" />
    <circle cx="14" cy="14" r="5" fill="#10b981" />
    <text x="28" y="18" fill="#c7d2fe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" letter-spacing="0.8">CURATED ECOSYSTEM 2026</text>
  </g>

  <!-- 5. Main Title & Subtitle (Crisp Foreground, 100% Unobscured) -->
  <g transform="translate(56, 120)">
    <!-- Title Shadow & Gradient Text -->
    <text x="0" y="0" fill="#000000" opacity="0.4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="38" font-weight="900" letter-spacing="-0.5">Awesome Mobile Asset Capture</text>
    <text x="0" y="-1" fill="url(#accentGrad1)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="38" font-weight="900" letter-spacing="-0.5">Awesome Mobile Asset Capture</text>

    <!-- Subtitle -->
    <text x="0" y="38" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16.5" font-weight="600" opacity="0.95">
      The Curated Directory of Mobile Digitization, On-Device OCR &amp; Physical Asset Tools
    </text>
    <text x="0" y="66" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="400">
      From enterprise document scanners to privacy-first edge OCR, barcode inventory, and PBR textures.
    </text>
  </g>

  <!-- 6. Feature Badges / Highlights (Foreground Bottom) -->
  <g transform="translate(56, 245)">
    <!-- Badge 1: On-Device OCR -->
    <g transform="translate(0, 0)">
      <rect width="135" height="34" rx="8" fill="url(#cardGrad)" stroke="#3b82f6" stroke-width="1.2" />
      <text x="14" y="21" font-size="14">🔍</text>
      <text x="36" y="21" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700">On-Device OCR</text>
    </g>

    <!-- Badge 2: Document Scanning -->
    <g transform="translate(147, 0)">
      <rect width="160" height="34" rx="8" fill="url(#cardGrad)" stroke="#8b5cf6" stroke-width="1.2" />
      <text x="14" y="21" font-size="14">📄</text>
      <text x="36" y="21" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700">Document Scanning</text>
    </g>

    <!-- Badge 3: Barcode & Inventory -->
    <g transform="translate(319, 0)">
      <rect width="168" height="34" rx="8" fill="url(#cardGrad)" stroke="#06b6d4" stroke-width="1.2" />
      <text x="14" y="21" font-size="14">📦</text>
      <text x="36" y="21" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700">Barcode &amp; Inventory</text>
    </g>

    <!-- Badge 4: Privacy & Offline -->
    <g transform="translate(499, 0)">
      <rect width="158" height="34" rx="8" fill="url(#cardGrad)" stroke="#10b981" stroke-width="1.2" />
      <text x="14" y="21" font-size="14">🔒</text>
      <text x="36" y="21" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700">Privacy &amp; Offline</text>
    </g>
  </g>

  <!-- Outer Glowing Border Accent -->
  <rect x="1" y="1" width="998" height="338" rx="15" fill="none" stroke="#475569" stroke-width="1" stroke-opacity="0.4" />
</svg>
